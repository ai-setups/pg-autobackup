# The backup policy: full backups are kept for 7 days, so every point of the last 7 days
# can be restored. The container supplies the endpoint, bucket, repository path and key
# pair through PGBACKREST_REPO1_* variables, which override this file. The region and
# URI style suit Cloudflare R2.
[global]
repo1-type=s3
repo1-s3-region=auto
repo1-s3-uri-style=path
repo1-retention-full-type=time
repo1-retention-full=7
repo1-bundle=y
compress-type=zst
start-fast=y
log-level-console=info
log-level-file=off

[main]
pg1-path=/var/lib/postgresql/data
